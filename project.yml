name: Splice

options:
  bundleIdPrefix: com.zjzbs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 固定生成 Xcode 15 兼容格式的工程文件。
  # 不写这行的话，XcodeGen 新版会生成 objectVersion 77（Xcode 16 格式），
  # 老版本 Xcode 打不开。
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: "iphoneos"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

targets:

  Splice:
    type: application
    platform: iOS
    sources:
      - path: Splice/App
      - path: Splice/Core
      - path: Splice/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zjzbs.splice
        PRODUCT_NAME: Splice
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: Splice/Generated/AppInfo.plist
      properties:
        CFBundleDisplayName: Splice
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        NSPhotoLibraryUsageDescription: Splice 需要读取你最近的截图，用来识别重叠部分并拼接成长图。
        NSPhotoLibraryAddUsageDescription: Splice 需要把拼好的长图保存到你的相册。

schemes:
  Splice:
    build:
      targets:
        Splice: all
    run:
      config: Debug
    archive:
      config: Release
